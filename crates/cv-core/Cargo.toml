[package]
name = "cv-core"
description = "CV model, recruiter checks and Word/PDF output for CVBuilder"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
wordcraft-doc.workspace = true
wordcraft-docx.workspace = true
wordcraft-docbin.workspace = true
wordcraft-formats.workspace = true
zip = { version = "3", default-features = false, features = ["deflate"] }
wordcraft-pdf.workspace = true
wordcraft-layout.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
base64 = "0.22"
regex = "1"
pdf-extract = "0.12"
# Europass: the XML the editor saves, and the copy it attaches to its PDFs (same versions pdf-extract and WordCraft already use).
lopdf = { version = "0.42", default-features = false }
quick-xml = "0.41"
# Right-to-left and Indic PDFs: read with ActualText and in reading order (pdfread.rs).
hayro-syntax = "0.7.2"
hayro-interpret = { version = "0.7.0", default-features = false, features = ["embed-fonts"] }
hayro-cmap = "0.1"
kurbo = "0.13"
# Offline spell check (spelling.rs): Hunspell dictionaries in pure Rust, and the bundled ones gzipped.
spellbook = "0.4.2"
flate2 = "1"

[workspace]
resolver = "3"
# crates/ is used by every platform; platforms/windows, linux and macos hold only what differs.
members = ["crates/cv-core", "crates/cv-ai", "crates/cv-mcp", "crates/app", "platforms/windows", "platforms/linux", "platforms/macos"]

[workspace.package]
version = "1.3.1"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"

# Only the WordCraft pieces needed to build, lay out, and write Word and PDF files.
# Pinned to one reviewed commit so every build is reproducible.
[workspace.dependencies]
# wordcraft from the SoloSaftis fork: storytold/wordcraft at 661a790 plus the PDF text fix for
# Devanagari and other left-to-right complex scripts, Arabic, and Latin letters drawn with marks
# («å» in Cambria and Calibri) (branch cvbuilder-pdf-aring, from cvbuilder-pdf-text).
wordcraft-doc = { git = "https://github.com/SoloSaftis/wordcraft", rev = "aeeb2b62438d806e01f6ec5d59db337c725cdae7" }
wordcraft-docx = { git = "https://github.com/SoloSaftis/wordcraft", rev = "aeeb2b62438d806e01f6ec5d59db337c725cdae7" }
wordcraft-docbin = { git = "https://github.com/SoloSaftis/wordcraft", rev = "aeeb2b62438d806e01f6ec5d59db337c725cdae7" }
wordcraft-formats = { git = "https://github.com/SoloSaftis/wordcraft", rev = "aeeb2b62438d806e01f6ec5d59db337c725cdae7" }
wordcraft-pdf = { git = "https://github.com/SoloSaftis/wordcraft", rev = "aeeb2b62438d806e01f6ec5d59db337c725cdae7" }
wordcraft-layout = { git = "https://github.com/SoloSaftis/wordcraft", rev = "aeeb2b62438d806e01f6ec5d59db337c725cdae7" }
wordcraft-render = { git = "https://github.com/SoloSaftis/wordcraft", rev = "aeeb2b62438d806e01f6ec5d59db337c725cdae7" }
wordcraft-fonts = { git = "https://github.com/SoloSaftis/wordcraft", rev = "aeeb2b62438d806e01f6ec5d59db337c725cdae7" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

# The same patch recipe WordCraft uses: a consumer root must repeat it.
[patch.crates-io]
krilla = { git = "https://github.com/storytold/craft-libs", rev = "c5a1cbfb5f9049f9270955caffb5bee5997aebf7" }
ecolor = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
emath = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
epaint = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
epaint_default_fonts = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui_kittest = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui-winit = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui-wgpu = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui_glow = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui_extras = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
eframe = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
winit = { git = "https://github.com/storytold/winit.git", rev = "a517b3846ee8457d84ee4975110bfda6797c44dc" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

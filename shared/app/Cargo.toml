[package]
name = "cvbuilder-app"
description = "SHARED: the CVBuilder desktop window (egui), started by the windows/, linux/ and macos/ launchers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
cv-core = { path = "../cv-core" }
cv-ai = { path = "../cv-ai" }
wordcraft-layout.workspace = true
wordcraft-render.workspace = true
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "wgpu", "accesskit", "clipboard", "wayland", "x11"] }
egui = "0.37"
rfd = "0.17"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "tiff", "ico"] }
base64 = "0.22"
dirs = "6"
serde.workspace = true
serde_json.workspace = true
